services:
  # PHPウェブサービス
  - type: web
    name: device-manager
    env: docker
    region: singapore  # またはお好みのリージョン
    plan: free  # または starter / standard
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    envVars:
      - key: DB_TYPE
        value: mysql
      - key: DB_HOST
        value: 34.31.195.202  # Cloud SQL porfolio instance
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        value: device_management
      - key: DB_USER
        value: admin
      - key: DB_PASS
        sync: false  # Render Dashboardで手動設定
      - key: DB_SSL_MODE
        value: "1"
    # 注意: ディスクは有料プラン（Starter以上）でのみ利用可能
    # 無料プランの場合は以下をコメントアウト
    # disk:
    #   name: fusion-uploads
    #   mountPath: /var/www/html/uploads
    #   sizeGB: 1

# Google Cloud SQLを使用（外部データベース）
# databases:
